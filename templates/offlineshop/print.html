{% extends "print.html" %} {% block page %}
<div class="row justify-center">
  <div v-for="item in items" class="q-my-sm q-mx-lg">
    <div class="text-center q-ma-none q-mb-sm">
      <span v-text="item.name"></span>
    </div>
    <lnbits-qrcode
      :value="setBech32(item.url)"
      :show-buttons="false"
    ></lnbits-qrcode>
    <div class="text-center q-ma-none q-mt-sm">
      <span v-text="item.price"></span>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  window.app = Vue.createApp({
    el: '#vue',
    data() {
      return {
        items: JSON.parse('{{ items | tojson | safe }}')
      }
    },
    created() {
      window.print()
    },
    methods: {
      setBech32(url) {
        const bytes = new TextEncoder().encode(url)
        const bech32 = NostrTools.nip19.encodeBytes('lnurl', bytes)
        return `lightning:${bech32.toUpperCase()}`
      }
    }
  })
</script>
{% endblock %}
